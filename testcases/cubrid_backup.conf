[backup]
remove_archive=false
sa_mode=false
no_check=true
thread_count=8
compress=false
except_active_log=false
sleep_msecs=20

# tiered buffer (Linux/POSIX only). Absent keys fall back to these defaults.
# buffer_memory_size=0 disables buffering entirely (legacy direct-FIFO path).
fifo_size=64KB
buffer_memory_size=64MB
buffer_disk_limit=0
buffer_disk_path=/var/tmp/cubrid_backup_spool
buffer_disk_keep_spool=false
